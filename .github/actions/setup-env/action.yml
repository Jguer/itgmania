name: "Setup Build Environment"
description: "Installs dependencies required to build ITGmania based on the runner's operating system."
inputs:
  os:
    description: "The OS name from the matrix (e.g., ubuntu-24.04, macos-15, windows-2022)"
    required: true
  ccache:
    description: "Whether to install ccache"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libgl-dev libglu1-mesa-dev libgtk-3-dev libjack-dev libpulse-dev libudev-dev libxinerama-dev libx11-dev libxrandr-dev libxtst-dev nasm
        if [ "${{ inputs.ccache }}" = "true" ]; then
          sudo apt-get install -y ccache
        fi
      shell: bash

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew install nasm
        if [ "${{ inputs.ccache }}" = "true" ]; then
          brew install ccache
        fi
      shell: bash

    - name: Install OpenTelemetry dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get install -y curl libcurl4-openssl-dev libabsl-dev libgrpc-dev libgrpc++-dev protobuf-compiler protobuf-compiler-grpc
      shell: bash

    - name: Install OpenTelemetry dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install curl abseil grpc protobuf protobuf-c pkg-config
      shell: bash

    - name: Install OpenTelemetry dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg.exe install curl:x64-windows abseil:x64-windows protobuf:x64-windows grpc:x64-windows
      shell: pwsh

    - name: Install Windows dependencies
      if: runner.os == 'Windows'
      run: |
        if [ "${{ inputs.ccache }}" = "true" ]; then
          choco install ccache
        fi
      shell: bash

    - name: ccache
      if: inputs.ccache == 'true'
      uses: actions/cache@v5
      with:
        path: .ccache
        key: ${{ inputs.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ inputs.os }}-ccache-${{ github.ref }}-
          ${{ inputs.os }}-ccache-

    - name: Set ccache environment
      if: inputs.ccache == 'true'
      run: |
        mkdir -p .ccache
        echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
        echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV
      shell: bash

    - name: Add msbuild to PATH
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Set CMake environment variables (Linux)
      if: runner.os == 'Linux'
      run: |
        echo "CMAKE_BUILD_FLAGS=--parallel $(nproc)" >> $GITHUB_ENV
        echo "ARTIFACT_PATH=build/ITGmania-*.tar.gz" >> $GITHUB_ENV
      shell: bash

    - name: Set CMake environment variables (macOS M1)
      if: inputs.os == 'macos-15'
      run: |
        echo "CMAKE_FLAGS=-DCMAKE_OSX_ARCHITECTURES=arm64" >> $GITHUB_ENV
        echo "CMAKE_BUILD_FLAGS=--parallel $(sysctl -n hw.logicalcpu)" >> $GITHUB_ENV
        echo "ARTIFACT_PATH=build/ITGmania-*.dmg" >> $GITHUB_ENV
      shell: bash

    - name: Set CMake environment variables (macOS Intel)
      if: inputs.os == 'macos-15-intel'
      run: |
        echo "CMAKE_FLAGS=-DCMAKE_OSX_ARCHITECTURES=x86_64" >> $GITHUB_ENV
        echo "CMAKE_BUILD_FLAGS=--parallel $(sysctl -n hw.logicalcpu)" >> $GITHUB_ENV
        echo "ARTIFACT_PATH=build/ITGmania-*.dmg" >> $GITHUB_ENV
      shell: bash

    - name: Set CMake environment variables (Windows)
      if: runner.os == 'Windows'
      run: |
        echo "CMAKE_BUILD_FLAGS=--parallel $env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_ENV
        echo "ARTIFACT_PATH=build/ITGmania-*.exe" >> $env:GITHUB_ENV
      shell: pwsh

    # OpenTelemetry needs a few extra CMake flags on top of the per-OS defaults
    # set above. These append, so they must stay after those steps.
    - name: Set OpenTelemetry CMake flags (Linux ARM)
      if: inputs.os == 'ubuntu-24.04-arm'
      run: echo "CMAKE_FLAGS=$CMAKE_FLAGS -DWITH_MINIMAID=OFF" >> $GITHUB_ENV
      shell: bash

    - name: Set OpenTelemetry CMake flags (macOS)
      if: runner.os == 'macOS'
      run: echo "CMAKE_FLAGS=$CMAKE_FLAGS -DCMAKE_PREFIX_PATH=$(brew --prefix)" >> $GITHUB_ENV
      shell: bash

    - name: Set OpenTelemetry CMake flags (Windows)
      if: runner.os == 'Windows'
      run: echo "CMAKE_FLAGS=$env:CMAKE_FLAGS -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
      shell: pwsh
